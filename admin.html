<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to HouseCare Admin</title>
  <script src="auth.js" defer></script>
  <script defer>
    window.addEventListener("DOMContentLoaded", () => {
      if (window.HouseCareAuth && HouseCareAuth.getAdminToken()) {
        window.location.replace("admin-dashboard.html");
        return;
      }
      window.location.replace("admin-login.html?redirect=admin-dashboard.html");
    });
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Poppins, sans-serif;
      background: #eef4fb;
      color: #152033;
    }
  </style>
</head>
<body>
  <p>Redirecting to the admin portal...</p>
</body>
</html>
