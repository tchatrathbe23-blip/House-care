<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invoice</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Check authentication on page load
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'index.html';
      }
    });

    window.onload = () => {
      const data = JSON.parse(localStorage.getItem("invoice-data") || "{}");
      document.getElementById("invName").textContent = data.name;
      document.getElementById("invPhone").textContent = data.phone;
      document.getElementById("invService").textContent = data.service;
      document.getElementById("invDate").textContent = data.date;
      document.getElementById("invTime").textContent = data.time;
      document.getElementById("invAddress").textContent = data.address;
      document.getElementById("invStatus").textContent = data.status;
    };

    function downloadPDF() { window.print(); }
  </script>
</head>

<body class="invoice-body">

  <div class="invoice-box">
    <h1>HouseCare – Invoice</h1>

    <p><strong>Name:</strong> <span id="invName"></span></p>
    <p><strong>Phone:</strong> <span id="invPhone"></span></p>
    <p><strong>Service:</strong> <span id="invService"></span></p>
    <p><strong>Date:</strong> <span id="invDate"></span></p>
    <p><strong>Time:</strong> <span id="invTime"></span></p>
    <p><strong>Address:</strong> <span id="invAddress"></span></p>
    <p><strong>Status:</strong> <span id="invStatus"></span></p>

    <button onclick="downloadPDF()" class="small-btn">Download PDF</button>
  </div>
</body>
</html>
